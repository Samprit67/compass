# One-click deploy to Render (https://render.com). Push the repo, then in the
# Render dashboard choose "New > Blueprint" and point it at this file.
services:
  - type: web
    name: compass
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: python -m uvicorn compass.api:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
