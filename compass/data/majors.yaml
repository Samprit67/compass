# Curated list of common US undergraduate majors, each mapped to one or more
# 2020 CIP codes. The refresh script (compass/data/refresh.py) joins these to
# O*NET occupations through the NCES CIP-to-SOC crosswalk and builds an interest
# profile for each major.
#
# This list is deliberately not exhaustive: the ~2,100 six-digit CIP codes
# include things like "Czech Language and Literature" and "Poultry Veterinary
# Residency". The goal here is the set of majors an 18-year-old actually chooses
# between. Add one by giving it a slug, a name, a category, a one-line blurb, and
# the CIP code(s) whose occupations describe the field.

