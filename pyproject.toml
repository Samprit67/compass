[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compass"
version = "0.1.0"
description = "Recommend college majors from your interests, using the RIASEC data career counselors actually use."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Samprit Goswami" }]
keywords = ["career", "college", "major", "riasec", "holland", "onet", "recommender"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.24",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.90",
    "httpx>=0.27",  # Starlette's TestClient needs an HTTP client
    "ruff>=0.6",
    "mypy>=1.8",
    "types-pyyaml",
]
data = [
    "httpx>=0.27",
    "openpyxl>=3.1",
]

[project.scripts]
compass = "compass.cli:main"

[project.urls]
Homepage = "https://github.com/Samprit67/compass"
Repository = "https://github.com/Samprit67/compass"
Issues = "https://github.com/Samprit67/compass/issues"

[tool.hatch.build.targets.wheel]
packages = ["compass"]
artifacts = [
    "compass/web/**/*",
    "compass/data/*.json",
    "compass/data/*.yaml",
]

[tool.ruff]
line-length = 108
target-version = "py310"
src = ["compass", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "PIE"]
ignore = [
    "B008",   # Typer/FastAPI deliberately call functions in argument defaults
    "RUF012", # ClassVar noise on dataclass-ish containers
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
# Runtime supports 3.10+, but numpy's bundled stubs use 3.12 `type` syntax that
# older targets cannot parse. Check against 3.12 semantics; nothing here relies
# on 3.11/3.12-only language features.
python_version = "3.12"
packages = ["compass"]
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_incomplete_defs = true
# The model core is checked strict. The layers that shuttle values in from
# government text files, Typer Option() defaults and FastAPI request plumbing
# produce more noise than signal under a strict config, so they run looser.

[[tool.mypy.overrides]]
module = ["uvicorn.*", "numpy.*", "openpyxl.*", "yaml.*", "httpx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["compass.cli", "compass.api.*", "compass.data.refresh"]
disallow_incomplete_defs = false
disable_error_code = ["arg-type", "assignment", "no-untyped-def", "operator", "union-attr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:compass.*",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.coverage.run]
branch = true
source = ["compass"]
omit = ["compass/__main__.py", "compass/data/refresh.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]
